<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escritório Virtual de Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="Escritório 3D"></canvas>
<div id="tags"></div>

<div id="top" class="hud">
  <div id="brand" class="card">
    <h1>Escritório Virtual de Marketing</h1>
    <div class="sub">Salário-maternidade</div>
    <div class="mission" id="missionTxt">Carregando a Central de Tarefas…</div>
    <div class="bar" id="missionBarWrap"><i id="missionBar" style="width:0%"></i></div>
    <div id="store"><i id="storeDot"></i><span id="storeTxt">Conectando ao armazenamento…</span></div>
  </div>
  <nav id="menu" class="card" aria-label="Acesso rápido">
    <button type="button" data-hub="escritorio" title="Escritório">🏢 <span class="lb">Escritório</span></button>
    <button type="button" data-hub="tarefas" title="Central de Tarefas">📋 <span class="lb">Central de Tarefas</span></button>
    <button type="button" data-hub="arquivo" title="Estante / Arquivo">📁 <span class="lb">Estante / Arquivo</span></button>
    <button type="button" data-hub="notificacoes" title="Notificações">🔔 <span class="lb">Notificações</span><span class="badge" id="notifBadge" hidden>0</span></button>
    <button type="button" data-hub="equipe" title="Equipe">👥 <span class="lb">Equipe</span></button>
    <button type="button" data-hub="relatorios" title="Relatórios">📊 <span class="lb">Relatórios</span></button>
  </nav>
</div>
<div id="help" class="hud card"><kbd>↑</kbd> <kbd>↓</kbd> andar &nbsp; <kbd>←</kbd> <kbd>→</kbd> virar &nbsp; <kbd>E</kbd> interagir &nbsp; <kbd>C</kbd> câmera &nbsp; <kbd>Esc</kbd> fechar</div>
<div id="prompt" class="hud card" hidden><span><kbd>E</kbd> Interagir com <span class="who" id="promptWho"></span></span><button class="btn pri" id="promptBtn" type="button">Interagir</button></div>
<div id="toast" class="hud card" role="status"></div>
<div id="pad" class="hud" aria-label="Controles de toque">
  <button class="up" data-k="ArrowUp" aria-label="Andar para frente">▲</button>
  <button class="l" data-k="ArrowLeft" aria-label="Virar à esquerda">◀</button>
  <button class="dn" data-k="ArrowDown" aria-label="Andar para trás">▼</button>
  <button class="r" data-k="ArrowRight" aria-label="Virar à direita">▶</button>
</div>

<aside id="panel" class="card" hidden aria-live="polite">
  <header>
    <div class="avatar" id="pAvatar"></div>
    <div class="t"><h3 id="pName"></h3><div class="role" id="pRole"></div></div>
    <button class="x" id="pClose" type="button" aria-label="Fechar">×</button>
  </header>
  <div id="pbody"></div>
  <div id="pfoot" hidden>
    <form id="pForm"><textarea id="pInput" rows="1"></textarea><button class="btn pri" type="submit">ENVIAR</button></form>
    <div class="note" id="pNote"></div>
  </div>
</aside>

<section id="hub" class="card" hidden aria-live="polite">
  <header>
    <div class="avatar" id="hIcon"></div>
    <div class="t"><h2 id="hTitle"></h2><div class="role" id="hSub"></div></div>
    <button class="x" id="hClose" type="button" aria-label="Fechar">×</button>
  </header>
  <div id="hbody"></div>
</section>

<div id="dlgWrap" hidden>
  <div id="dlg" class="card" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <header><h3 id="dlgTitle"></h3><button class="x" id="dlgClose" type="button" aria-label="Fechar">×</button></header>
    <div id="dlgBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./js/integracoes.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
